name: Instagram auto-post

on:
  # Backup timer. GitHub often delays or skips these, so the main
  # trigger is cron-job.org calling "repository_dispatch" every hour.
  schedule:
    - cron: "35 2-15 * * *"     # :05 past each hour, 8 AM - 9 PM IST
  repository_dispatch:
    types: [post]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't actually post)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # always the newest state.json (no double posts)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post if something is due
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/post.py --dry-run
          else
            python scripts/post.py
          fi

      - name: Save progress
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name  "linux-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Posted $(python -c 'import json;print(json.load(open("state.json"))["history"][-1]["id"])')"
            git pull --rebase origin main
            git push
          fi
